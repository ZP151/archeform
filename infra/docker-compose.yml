name: factory-pilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory_pilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory_pilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - factory-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    environment:
      DATABASE_URL: postgresql://factory:factory@postgres:5432/factory_pilot?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  compiler-worker:
    build:
      context: ..
      dockerfile: apps/compiler-worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      FACTORY_ARTIFACT_ROOT: /artifacts
      FACTORY_CONTROL_PLANE_URL: http://control-plane:3000
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started
    volumes:
      - factory-artifacts:/artifacts

  workbench:
    build:
      context: ..
      dockerfile: apps/workbench/Dockerfile
    depends_on:
      - control-plane
    ports:
      - "5174:5174"

volumes:
  factory-postgres:
  factory-artifacts:
