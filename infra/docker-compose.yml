name: factory-pilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory_pilot
    ports:
      - "${FACTORY_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory_pilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - factory-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command:
      [
        "sh",
        "-ec",
        'exec redis-server --requirepass "$${FACTORY_REDIS_PASSWORD}"',
      ]
    environment:
      FACTORY_REDIS_PASSWORD: ${FACTORY_REDIS_PASSWORD:?required}
    ports:
      - "127.0.0.1:${FACTORY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${FACTORY_REDIS_PASSWORD}" redis-cli ping',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    environment:
      DATABASE_URL: postgresql://factory:factory@postgres:5432/factory_pilot?schema=public
      REDIS_URL: redis://redis:6379
      FACTORY_REDIS_PASSWORD: ${FACTORY_REDIS_PASSWORD:?required}
      FACTORY_INTERNAL_WORKER_TOKEN: ${FACTORY_INTERNAL_WORKER_TOKEN:?required}
      PORT: 3000
      FACTORY_ARTIFACT_ROOT: /artifacts
      # Optional and intentionally passed only into the local Control Plane.
      # Neither the Worker nor generated applications receive model credentials.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${FACTORY_CONTROL_PLANE_PORT:-3000}:3000"
    volumes:
      - factory-artifacts:/artifacts:ro

  compiler-worker:
    build:
      context: ..
      dockerfile: apps/compiler-worker/Dockerfile
    # The verification probes and the worker's docker CLI both address the
    # generated previews through the host loopback (docker publishes the
    # generated compose ports on 127.0.0.1), so the worker must share the
    # host network namespace instead of the compose bridge.
    network_mode: host
    environment:
      REDIS_URL: redis://127.0.0.1:${FACTORY_REDIS_PORT:-6379}
      FACTORY_REDIS_PASSWORD: ${FACTORY_REDIS_PASSWORD:?required}
      FACTORY_INTERNAL_WORKER_TOKEN: ${FACTORY_INTERNAL_WORKER_TOKEN:?required}
      FACTORY_ARTIFACT_ROOT: /artifacts
      FACTORY_CONTROL_PLANE_URL: http://127.0.0.1:${FACTORY_CONTROL_PLANE_PORT:-3000}
      RESTAURANT_DEMO_TABLE_TOKEN: ${RESTAURANT_DEMO_TABLE_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started
    volumes:
      - factory-artifacts:/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

  workbench:
    build:
      context: ..
      dockerfile: apps/workbench/Dockerfile
      args:
        NEXT_PUBLIC_CONTROL_PLANE_URL: ${FACTORY_PUBLIC_CONTROL_PLANE_URL:-http://localhost:${FACTORY_CONTROL_PLANE_PORT:-3000}}
    depends_on:
      - control-plane
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: ${FACTORY_PUBLIC_CONTROL_PLANE_URL:-http://localhost:${FACTORY_CONTROL_PLANE_PORT:-3000}}
      # The Golden Path plan route reads recipe fixtures from the repository
      # root (the whole workspace is copied into the image at /workspace).
      FACTORY_REPOSITORY_ROOT: /workspace
      # Explicit development/E2E-only lever for the deterministic fixture
      # interpreter; default off, never a fallback. Final acceptance runs
      # without it and fails closed unless a real provider key is configured.
      FACTORY_FIXTURE_MODE: ${FACTORY_FIXTURE_MODE:-}
    ports:
      - "${FACTORY_WORKBENCH_PORT:-5174}:5174"

volumes:
  factory-postgres:
  factory-artifacts:
