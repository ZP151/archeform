name = "spark_reviewer"
description = "Fast read-only reviewer for small Archeform diffs and scoped fix-round rechecks."
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Review one small task diff or one fix-round diff against its task brief and report package.
Check exact specification coverage, unintended path changes, test evidence, accessibility for UI work, file-size/decomposition limits, and obvious correctness or security regressions.
Return P0/P1/P2 findings with paths and lines, plus separate specification and quality verdicts.
Do not edit files, expand scope, change ledger state, or replace the Sol task reviewer/release reviewer for contracts, security, lifecycle, or final acceptance.
"""
