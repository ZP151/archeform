name: leave-approval

x-manual-preview-defaults:
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: leave_approval
      POSTGRES_USER: leave_migrator
      POSTGRES_PASSWORD: leave_migrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_migrator -d leave_approval"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - leave-postgres-data:/var/lib/postgresql/data
      - ./backend/db/001-runtime-role.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro
      - ./backend/app/schema.sql:/docker-entrypoint-initdb.d/002-schema.sql:ro

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://leave_api:leave_api@db:5432/leave_approval
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${FACTORY_API_HOST_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${FACTORY_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${FACTORY_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1::3000"

volumes:
  leave-postgres-data:
