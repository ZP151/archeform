name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.11.0, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Compatibility tests inspect immutable source commits and lockfiles.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: corepack prepare pnpm@9.0.0 --activate
      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run doctor:toolchain
      - run: pnpm --filter @factory/control-plane prisma:generate
        env:
          DATABASE_URL: postgresql://factory:factory@127.0.0.1:1/factory_pilot?schema=public
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: node --test scripts/regression.test.mjs scripts/definition-case-index.test.mjs
      - run: node scripts/verify-product-definition-data.mjs
      - run: node scripts/definition-case-index.mjs --check
      - run: pnpm exec tsc -p e2e/tsconfig.consumer-delivery.json --noEmit
      - run: pnpm exec playwright test e2e/helpers/content-directory.test.ts e2e/helpers/inventory-operations.test.ts e2e/helpers/service-work-orders.test.ts --workers=1
      - run: pnpm verify:third-party
      - run: pnpm verify:source-studies
